name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: >
          python -m pip install
          -r requirements.txt -r requirements-image.txt -r requirements-api.txt
          -r requirements-storage.txt -r requirements-dev.txt httpx
      - name: Tests
        run: python -m pytest -q -rs
